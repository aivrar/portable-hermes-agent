# Dependabot configuration for Portable Hermes.
#
# Deliberately scoped to github-actions only.
#
# This repository holds only the portable wrapper. The Hermes core and its
# Python dependencies come from NousResearch/hermes-agent at install time,
# pinned by that project's own uv.lock; their updates belong upstream. The
# only Python requirement tracked here is the test runner pin in
# tests/requirements.txt, moved deliberately, not on a schedule.
#
# Action pins (full commit SHAs, per supply-chain policy) must follow
# upstream action patches, usually themselves security fixes. Dependabot
# opens a PR with the new SHA and release notes; it is reviewed and merged
# like any other PR.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      # Batch routine action bumps into one PR per week to reduce noise.
      # Security updates still open individually and bypass grouping.
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
