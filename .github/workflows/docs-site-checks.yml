name: Docs Site Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: ubuntu-latest
    # Docusaurus currently depends on image-size 2.0.2, whose malformed
    # ICNS/JXL/HEIF parsers can loop indefinitely and has no patched release.
    # Bound untrusted PR builds until Docusaurus can consume a fixed version.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website-compatible npm
        run: npm install --global npm@11.17.0

      - name: Install website dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci
          working-directory: website

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install ascii-guard
        uses: ./.github/actions/retry
        with:
          command: python -m pip install ascii-guard==2.3.0 pyyaml==6.0.3

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      - name: Lint docs diagrams
        run: npm run lint:diagrams
        working-directory: website

      - name: Build Docusaurus
        run: npm run build
        working-directory: website
