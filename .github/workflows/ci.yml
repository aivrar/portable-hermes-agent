name: CI

# Every pull request and every push to main runs the wrapper's tests on
# Windows against the pinned last-known-good Hermes core, then builds the
# release archive (portable-integrity.yml). The gate job below is the only
# check branch protection requires; keep its name.
#
# The same tests run weekly against upstream main in upstream-canary.yml,
# outside this gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-integrity:
    name: Portable integrity
    uses: ./.github/workflows/portable-integrity.yml

  all-checks-pass:
    name: All required checks pass
    needs: [portable-integrity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS" | python3 -c "
          import json, sys
          results = json.load(sys.stdin)
          failed = [r for r in results if r != 'success']
          if failed:
              print(f'::error::{len(failed)} job(s) did not succeed: {failed}')
              sys.exit(1)
          print('All checks passed')
          "
