name: Portable integrity

# The wrapper's tests on Windows against a real Hermes core, installed into
# this checkout the way install.bat installs it, then the release archive.
# Called by ci.yml (the first last-known-good core, the required check) and
# by upstream-canary.yml (upstream main, weekly); also runs for release tags.

on:
  workflow_call:
    inputs:
      core_ref:
        description: NousResearch/hermes-agent commit, branch or tag to install (empty for the first last-known-good commit)
        type: string
        default: ''
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      core_ref:
        description: NousResearch/hermes-agent commit, branch or tag to install (empty for the first last-known-good commit)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: portable-integrity-${{ github.ref }}-${{ inputs.core_ref || 'last-known-good' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-integrity:
    name: Windows GUI, update preservation, and release archive
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The v1.4.18 hand-over tests read the released launchers from this tag;
      # under CI they fail instead of skipping when it is missing.
      - name: Fetch the v1.4.18 tag
        run: git fetch --no-tags --depth=1 origin +refs/tags/v1.4.18:refs/tags/v1.4.18
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            portable_hermes/manifests/last-known-good.json
            tests/requirements.txt
      - name: Choose the Hermes core
        id: core
        env:
          CORE_REF: ${{ inputs.core_ref }}
        run: |
          if [ -z "$CORE_REF" ]; then
            CORE_REF=$(python -c "import json; print(json.load(open('portable_hermes/manifests/last-known-good.json'))['candidates'][0]['commit'])")
          fi
          echo "Hermes core to install: $CORE_REF"
          echo "ref=$CORE_REF" >> "$GITHUB_OUTPUT"
      # install.bat's layout: the interpreter in python_embedded, this folder
      # on its path through hermes_project.pth.
      - name: Python in python_embedded
        run: |
          python -m venv python_embedded
          python_embedded/Scripts/python.exe -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from portable_hermes import bridge; (bridge.site_packages(Path('python_embedded')) / bridge.PROJECT_PTH_NAME).write_text(str(Path.cwd()) + '\n', encoding='utf-8')"
      - name: Install the Hermes core into this checkout
        env:
          CORE_REF: ${{ steps.core.outputs.ref }}
        run: python_embedded/Scripts/python.exe -m portable_hermes core install --ref "$CORE_REF" --no-fallback
      - name: Git sees no change after the core install
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [ -n "$changes" ]; then
            echo "$changes" | head -n 50
            echo "::error::Installing the core changed or added files that git sees. Check .gitignore and the ownership rules (portable_hermes/ownership.py)."
            exit 1
          fi
      - name: Install the test requirements
        run: python_embedded/Scripts/python.exe -m pip install -r tests/requirements.txt
      - name: Require working real Tk widgets
        run: python_embedded/Scripts/python.exe -c "import tkinter as tk; r=tk.Tk(); r.withdraw(); r.update(); r.destroy()"
      - name: Test the GUI with real Tk widgets
        # pytest's fd capture can break Tcl's Windows file channels (init.tcl:
        # "couldn't read file ... No error"); sys capture leaves OS handles intact.
        run: python_embedded/Scripts/python.exe -m pytest tests/gui --capture=sys
      - name: Test the launchers, updaters, release builder and portable tools
        run: python_embedded/Scripts/python.exe -m pytest tests --ignore=tests/gui
      - name: Build and verify every release archive member
        env:
          ARCHIVE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: python build_release.py --version "$ARCHIVE_VERSION" --output-dir "$RUNNER_TEMP/portable-release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-portable-release
          path: ${{ runner.temp }}/portable-release/*.zip
          if-no-files-found: error
          retention-days: 7
